name: flight-gate-scheduler

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      TZ: UTC
    volumes:
      - .:/var/www/html
      - flight_gate_scheduler_storage_data:/var/www/html/storage
    command:
      - sh
      - -c
      - >-
        mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data
        storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
        && chown -R www-data:www-data bootstrap/cache storage
        && exec php-fpm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    environment:
      TZ: UTC
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
        restart: true

  postgres:
    image: postgres:16-alpine
    environment:
      TZ: UTC
      POSTGRES_DB: flight_gate_scheduler
      POSTGRES_USER: flight_gate_scheduler
      POSTGRES_PASSWORD: flight_gate_scheduler
    volumes:
      - flight_gate_scheduler_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_gate_scheduler -d flight_gate_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    environment:
      TZ: UTC
    command: redis-server --appendonly yes
    volumes:
      - flight_gate_scheduler_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      TZ: UTC
    volumes:
      - .:/var/www/html
      - flight_gate_scheduler_storage_data:/var/www/html/storage
    command:
      - sh
      - -c
      - >-
        mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data
        storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
        && chown -R www-data:www-data bootstrap/cache storage
        && exec php artisan queue:work --tries=3 --timeout=120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      TZ: UTC
    volumes:
      - .:/var/www/html
      - flight_gate_scheduler_storage_data:/var/www/html/storage
    command:
      - sh
      - -c
      - >-
        mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data
        storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
        && chown -R www-data:www-data bootstrap/cache storage
        && exec php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node:
    image: node:22-alpine
    environment:
      TZ: UTC
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5174:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - app

volumes:
  flight_gate_scheduler_postgres_data:
  flight_gate_scheduler_redis_data:
  flight_gate_scheduler_storage_data:
